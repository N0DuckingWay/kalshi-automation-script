name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Pushes to main always run CI. A PR runs it only when it changes more than
  # one file or more than 10 lines (additions + deletions); the numbers come
  # straight from the pull_request event payload, so no checkout is needed.
  gate:
    name: Size gate
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.decide.outputs.run_ci }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          FILES: ${{ github.event.pull_request.changed_files }}
          ADDITIONS: ${{ github.event.pull_request.additions }}
          DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LINES=$((ADDITIONS + DELETIONS))
          echo "PR changes $FILES file(s) and $LINES line(s)"
          if [ "$FILES" -gt 1 ] || [ "$LINES" -gt 10 ]; then
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_ci=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint (ruff)
    needs: gate
    if: needs.gate.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run ruff
        run: python3 -m ruff check kalshi_betting/

  test:
    name: Test (pytest)
    needs: gate
    if: needs.gate.outputs.run_ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run pytest
        run: python3 -m pytest tests/ -v
